include:
  - project: mdapi/ci-templates
    file: /dast.yml
    ref: main
  - project: mdapi/ci-templates
    file: /sast.yml
    ref: main
  - project: mdapi/ci-templates
    file: /buildkit-before-script.yml
    ref: main
  - project: mdapi/ci-templates
    file: /notify.yml
    ref: main
  - project: mdapi/ci-templates
    file: /secret-scan.yml
    ref: main
  - project: mdapi/ci-templates
    file: /scan.yml
    ref: main

stages:
  - test
  - build
  - scan
  - web-scan
  - notify
  - code-scan

# The config-v1.1.xml a mail client reads (tests/, stdlib only, infra-5tpra).
# `rules:` so MR pipelines run it too: a job without them is absent there.
test:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3-alpine
  stage: test
  tags:
    - mdapi
  rules:
    - when: on_success
  script:
    - python3 -m unittest discover -s tests -v

buildkit:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:rootless
    entrypoint: [""]
  stage: build
  tags:
    - mdapi
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    CACHE_IMAGE: $CI_REGISTRY_IMAGE:cache
  # ⛔⛔ This job used to publish :latest from EVERY pipeline, branches included —
  # it had no `rules:` at all. Combined with a Deployment on `imagePullPolicy:
  # Always` + Keel `policy: force`, that made a plain `git push` of any branch a
  # PRODUCTION DEPLOY, with neither merge nor review in the path.
  #
  # Demonstrated on mdapi/keycloak 2026-09-22: pipeline 35876, on an unmerged
  # branch, published :latest and the running pod picked it up about ten minutes
  # BEFORE the MR was merged.
  #
  # ⭐ The build still runs everywhere — losing MR validation would be a real cost
  # and the build is what catches a broken Dockerfile. Only the TAG SET is
  # conditional: the floating tag Keel deploys from is minted on the default
  # branch only, while branches and MRs publish just the immutable SHA tag.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        IMAGE_TAGS: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA,$CI_REGISTRY_IMAGE:latest"
    - when: on_success
      variables:
        IMAGE_TAGS: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  extends: .buildkit-auth-setup
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --export-cache type=registry,ref=$CACHE_IMAGE \
        --import-cache type=registry,ref=$CACHE_IMAGE \
        --opt platform=linux/amd64 \
        --opt build-arg:CACHEBUST_DAY=$(date +%Y%m%d) \
        --opt build-arg:REGISTRY=$(echo "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}" | sed "s|:443||")/ \
        --progress=plain \
        --output type=image,\"name=${IMAGE_TAGS}\",push=true \
        > build.log 2>&1 || EXIT_CODE=$?
      cat build.log
      exit ${EXIT_CODE:-0}
  artifacts:
    when: always
    paths:
      - build.log
    expire_in: 7 days

# CVE scan via the shared job in mdapi/ci-templates (scan.yml):
# pinned grype + sha256, registry auth, and notifies only for
# HIGH/CRITICAL that actually have a fix.
scan:
  extends: .grype-scan

notify-failure:
  extends: .notify-failure
secret-scan:
  extends: .secret-scan

# Source scans (mdapi/ci-templates /sast.yml, infra-7rog.39/.40): Semgrep CE and
# osv-scanner on the default branch, non-blocking. The job NAMES are what the
# DefectDojo sync imports (sast -> semgrep-report.json, sca-source -> osv-report.json).
sast:
  extends: .semgrep

sca-source:
  extends: .osv-source

# Passive DAST of the image this pipeline built (ci-templates /dast.yml,
# infra-7rog.31.16): ZAP's baseline spider, no attacks, non-blocking; the
# DefectDojo sync imports zap-report.xml from this job name.
# The mail-client autoconfig server; it needs no dependency.
dast-baseline:
  extends: .zap-baseline
  needs: [buildkit]
  # The image this pipeline built, on zot: mdapi/<project> on the default
  # branch, mdapi-dev/<project> elsewhere (ci-templates .zot-built-image).
  rules: !reference [.zot-built-image, rules]
  services:
    - name: ${BUILT_IMAGE}
      alias: app
  variables:
    DAST_TARGET: http://app:80/
    DISPLAY_NAME: 'DAST'
    DISPLAY_SHORT_NAME: 'DAST'
    MAIL_HOSTNAME: 'mail.example.invalid'
